# ============================================================
# Configurazione Auto Debug Nielsen
# ============================================================

# Cartella root con gli Excel Audicom — aggiorna il nome della sottocartella ogni mese
segnalazioni_path: segnalazioni/06_2026_GEDI-MANZONI

# Dove salvare il report Excel generato
output_path: output

# Quante pagine aprire in parallelo con Playwright
# Aumentare se la macchina regge, diminuire se si vedono errori
playwright_concurrency: 6

# Secondi di attesa massima per ogni pagina (incluso caricamento Nielsen)
playwright_timeout: 30

# Pattern URL da escludere dall'analisi (login, API, funnel, ecc.)
# Queste URL appaiono nel report con una nota ma non vengono analizzate con Playwright.
skip_url_patterns:
  - /login
  - /account/
  - /checkout
  - /registr
  - /corporate/privacy
  - /api/

